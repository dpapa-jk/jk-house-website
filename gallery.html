<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Gallery | Joyce Kilmer House Program</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f4ea;color:#0b2f29;font-family:Arial,Helvetica,sans-serif}
.gallery-hero{width:100%;background:#123f36}
.gallery-hero img{display:block;width:100%;height:auto}
.gallery-wrap{max-width:1180px;margin:0 auto;padding:38px 28px 70px}
.gallery-title{text-align:center;margin-bottom:28px}
.gallery-title h1{margin:0 0 10px;font-size:clamp(42px,6vw,68px);line-height:1;color:#062f2a;font-weight:900;letter-spacing:-2px}
.gallery-title p{margin:0;font-size:clamp(17px,2vw,22px);color:#173c36}



.gallery-status{text-align:center;padding:28px;font-weight:700;color:#53645f}
.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.photo-card{background:white;border-radius:12px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.10)}
.photo-card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .2s ease}
.photo-card:hover img{transform:scale(1.025)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:28px}
.lightbox.open{display:flex}
.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:10px}
.close{position:absolute;right:24px;top:16px;border:none;background:none;color:white;font-size:48px;cursor:pointer}
.gallery-footer{background:#005243;color:white;text-align:center;padding:26px 20px;font-size:15px;letter-spacing:2px;font-weight:700}
@media(max-width:900px){.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-wrap{padding:30px 16px 50px}}
@media(max-width:460px){.photo-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html"><span class="brand-badge">JK</span><span>Joyce Kilmer House Program</span></a>
<nav class="nav">
<a href="house-cup.html">House Cup</a><a href="monday-house.html">Monday House</a><a href="events.html">Events</a><a href="student-hub.html">Student Hub</a><a href="staff-hub.html">Staff Hub</a><a href="gallery.html">Gallery</a><a href="news.html">News</a>
</nav>
</header>
<section class="gallery-hero"><img src="gallery-banner.png" alt="Joyce Kilmer House Program - Four Houses. One Family."></section>
<main class="gallery-wrap">
<div class="gallery-title"><h1>Photo Gallery</h1><p>Photos from across the Joyce Kilmer House Program.</p></div>
<div id="galleryStatus" class="gallery-status">Loading photos…</div>
<div id="liveGallery" class="photo-grid"></div>
</main>
<div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" id="closeLightbox" aria-label="Close">×</button><img id="lightboxImg" alt="Joyce Kilmer House Program photo"></div>
<footer class="gallery-footer">COOPERATION • ASSERTION • RESPONSIBILITY • EMPATHY • SELF-CONTROL</footer>
<script>
const GALLERY_FEED='https://script.google.com/macros/s/AKfycbzvAVyUc8VNbAlNv0aanYWtEAuX3v-CaMWaW-37Jt5zmMHfyr2LYycIVqq3HLkfFREgaQ/exec';
const statusEl=document.getElementById('galleryStatus'),galleryEl=document.getElementById('liveGallery'),lightbox=document.getElementById('lightbox'),lightboxImg=document.getElementById('lightboxImg');
function imageUrl(item){if(typeof item==='string')return item;return item.thumbnail||item.thumbnailUrl||item.url||item.image||item.src||item.link||''}
function imageName(item,i){if(typeof item==='string')return'Joyce Kilmer House Program photo';return item.name||item.title||item.filename||`Joyce Kilmer House Program photo ${i+1}`}
function normalize(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.images))return data.images;if(data&&Array.isArray(data.photos))return data.photos;if(data&&Array.isArray(data.files))return data.files;if(data&&Array.isArray(data.items))return data.items;return[]}
fetch(GALLERY_FEED,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{const photos=normalize(data).filter(x=>imageUrl(x));if(!photos.length){statusEl.textContent='Photos coming soon!';return}statusEl.style.display='none';galleryEl.innerHTML=photos.map((p,i)=>{const u=imageUrl(p),n=imageName(p,i).replace(/"/g,'&quot;');return`<div class="photo-card"><img src="${u}" alt="${n}" loading="lazy"></div>`}).join('');galleryEl.querySelectorAll('img').forEach(img=>img.addEventListener('click',()=>{lightboxImg.src=img.src;lightboxImg.alt=img.alt;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false')}))}).catch(()=>statusEl.textContent='Photos are temporarily unavailable. Please check back soon.');
function closeLightbox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');lightboxImg.src=''}
document.getElementById('closeLightbox').addEventListener('click',closeLightbox);lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
</script>
</body></html>
