<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery | Joyce Kilmer House Program</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
.topbar{height:70px;background:#075445;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%;gap:24px;font-family:Arial,Helvetica,sans-serif}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:800;font-size:16px;white-space:nowrap}
.brand-badge{width:43px;height:43px;border:3px solid #fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.nav{display:flex;align-items:center;gap:24px;flex-wrap:nowrap}
.nav a{color:#fff;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap}
.nav a:hover,.nav a:focus{text-decoration:underline;text-underline-offset:5px}
@media(max-width:900px){.topbar{height:auto;min-height:70px;padding:12px 4%;align-items:flex-start;flex-direction:column}.nav{gap:14px;flex-wrap:wrap}.nav a{font-size:13px}}
body{margin:0;background:#f8f4ea;color:#0b2f29;font-family:Arial,Helvetica,sans-serif}
.gallery-hero{width:100%;background:#123f36}
.gallery-hero img{display:block;width:100%;height:auto}
.gallery-wrap{max-width:1180px;margin:0 auto;padding:38px 28px 70px}
.gallery-title{text-align:center;margin-bottom:28px}
.gallery-title h1{margin:0 0 10px;font-size:clamp(42px,6vw,68px);line-height:1;color:#062f2a;font-weight:900;letter-spacing:-2px}
.gallery-title p{margin:0;font-size:clamp(17px,2vw,22px);color:#173c36}



.gallery-status{text-align:center;padding:28px;font-weight:700;color:#53645f}
.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.photo-card{background:white;border-radius:12px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.10)}
.photo-card{position:relative}
.photo-card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .2s ease}
.photo-card:hover img{transform:scale(1.025)}
.video-badge{position:absolute;left:12px;bottom:12px;background:rgba(0,55,46,.92);color:white;border:2px solid rgba(255,255,255,.8);border-radius:999px;padding:7px 11px;font-weight:900;font-size:12px;letter-spacing:.8px;display:flex;gap:7px;align-items:center;pointer-events:none}
.play-icon{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid white}
.video-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#005243,#08352f);color:#fff;font-size:48px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:28px}
.lightbox.open{display:flex}
.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:10px}
.lightbox iframe{width:min(92vw,1100px);height:min(78vh,700px);border:0;border-radius:12px;background:#000}
.close{position:absolute;right:24px;top:16px;border:none;background:none;color:white;font-size:48px;cursor:pointer}
.gallery-footer{background:#005243;color:white;text-align:center;padding:26px 20px;font-size:15px;letter-spacing:2px;font-weight:700}
@media(max-width:900px){.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-wrap{padding:30px 16px 50px}}
@media(max-width:460px){.photo-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html"><span class="brand-badge">JK</span><span>Joyce Kilmer House Program</span></a>
<nav class="nav">
<a href="index.html">Home</a><a href="house-cup.html">House Cup</a><a href="monthly-matchup.html">Monthly Matchup</a><a href="events.html">Events</a><a href="student-hub.html">Student Hub</a><a href="gallery.html">Gallery</a><a href="news.html">Knight News</a>
</nav>
</header>
<section class="gallery-hero"><img src="gallery-banner.png" alt="Joyce Kilmer House Program - Four Houses. One Family."></section>
<main class="gallery-wrap">
<div class="gallery-title"><h1>Photo Gallery</h1><p>Photos and videos from across the Joyce Kilmer House Program.</p></div>
<div id="galleryStatus" class="gallery-status">Loading photos & videos…</div>
<div id="liveGallery" class="photo-grid"></div>
</main>
<div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" id="closeLightbox" aria-label="Close">×</button><img id="lightboxImg" alt="Joyce Kilmer House Program photo"><iframe id="lightboxVideo" title="Joyce Kilmer House Program video" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe></div>
<footer class="gallery-footer">COOPERATION • ASSERTION • RESPONSIBILITY • EMPATHY • SELF-CONTROL</footer>
<script>
const GALLERY_FEED='https://script.google.com/macros/s/AKfycbzvAVyUc8VNbAlNv0aanYWtEAuX3v-CaMWaW-37Jt5zmMHfyr2LYycIVqq3HLkfFREgaQ/exec';
const statusEl=document.getElementById('galleryStatus');
const galleryEl=document.getElementById('liveGallery');
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightboxImg');
const lightboxVideo=document.getElementById('lightboxVideo');

function normalize(data){
  if(Array.isArray(data))return data;
  if(data&&Array.isArray(data.items))return data.items;
  if(data&&Array.isArray(data.files))return data.files;
  if(data&&Array.isArray(data.photos))return data.photos;
  if(data&&Array.isArray(data.images))return data.images;
  return [];
}
function itemType(item){
  const t=String(item?.type||item?.mimeType||'').toLowerCase();
  if(t.includes('video'))return 'video';
  return 'image';
}
function itemName(item,i){return item?.name||item?.title||item?.filename||`Joyce Kilmer House Program media ${i+1}`}
function thumbUrl(item){return item?.thumbnail||item?.thumbnailUrl||item?.url||item?.image||item?.src||''}
function previewUrl(item){return item?.preview||item?.previewUrl||item?.videoUrl||item?.embed||''}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

fetch(GALLERY_FEED,{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error();return r.json()})
.then(data=>{
  const items=normalize(data).filter(x=>thumbUrl(x)||previewUrl(x));
  if(!items.length){statusEl.textContent='Gallery coming soon!';return}
  statusEl.style.display='none';
  galleryEl.innerHTML=items.map((item,i)=>{
    const type=itemType(item),name=esc(itemName(item,i)),thumb=thumbUrl(item),preview=previewUrl(item);
    const visual=thumb?`<img src="${esc(thumb)}" alt="${name}" loading="lazy">`:`<div class="video-fallback">▶</div>`;
    const badge=type==='video'?'<div class="video-badge"><span class="play-icon"></span> VIDEO</div>':'';
    return `<div class="photo-card" data-type="${type}" data-preview="${esc(preview)}" data-src="${esc(thumb)}" data-name="${name}">${visual}${badge}</div>`;
  }).join('');
  galleryEl.querySelectorAll('.photo-card').forEach(card=>card.addEventListener('click',()=>openMedia(card)));
})
.catch(()=>statusEl.textContent='Gallery is temporarily unavailable. Please check back soon.');

function openMedia(card){
  const type=card.dataset.type;
  const name=card.dataset.name||'';
  if(type==='video'){
    lightboxImg.style.display='none';lightboxImg.src='';
    lightboxVideo.style.display='block';lightboxVideo.src=card.dataset.preview;
  }else{
    lightboxVideo.style.display='none';lightboxVideo.src='';
    lightboxImg.style.display='block';lightboxImg.src=card.dataset.src;lightboxImg.alt=name;
  }
  lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');
}
function closeLightbox(){
  lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');
  lightboxImg.src='';lightboxVideo.src='';lightboxVideo.style.display='none';lightboxImg.style.display='block';
}
document.getElementById('closeLightbox').addEventListener('click',closeLightbox);
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});
</script>
</body></html>
