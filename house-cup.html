<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Cup Standings | Joyce Kilmer House Program</title>
<style>
*{box-sizing:border-box} html,body{margin:0;background:#063d31;font-family:Arial,Helvetica,sans-serif}
.page{position:relative;width:100%;max-width:1024px;margin:0 auto;line-height:1}
.bg{display:block;width:100%;height:auto}
.navlink{position:absolute;z-index:20;top:4.7%;height:4.2%;display:block;-webkit-tap-highlight-color:rgba(255,255,255,.15)}
.nav-home{left:3.3%;width:8.5%}.nav-cup{left:13.1%;width:11.8%}.nav-monthly{left:26.2%;width:16.5%}.nav-events{left:44.2%;width:8.9%}.nav-student{left:54.8%;width:13.3%}.nav-gallery{left:69.3%;width:9.2%}.nav-news{left:80.5%;width:14.1%}
.point{position:absolute;z-index:15;top:45.15%;height:4.7%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(28px,5.4vw,60px);color:#fff}
#pf{left:7.1%;width:13.1%;background:#0870b4;color:#f6d35a}
#pv{left:31.2%;width:13.3%;background:#6731a4}
#pa{left:55.7%;width:13.1%;background:#cf1b18}
#ph{left:80.2%;width:13.2%;background:#d7a000}
.recent{position:absolute;z-index:16;left:2.2%;top:54.4%;width:95.6%;height:24.6%;background:#f3f0e8;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.rhead{height:26%;background:#075244;color:#fff;display:flex;align-items:center;padding:0 3.2%;gap:2%;font-weight:900}
.trophy{font-size:clamp(22px,4vw,46px);color:#f0d173}.rtitle strong{display:block;font-size:clamp(17px,3vw,36px);letter-spacing:.02em}.rtitle span{display:block;margin-top:.25em;font-size:clamp(11px,1.8vw,21px);letter-spacing:.13em}
.rbody{height:74%;padding:1.2% 1.1% 1.6%;background:#f6f4ef}.rtable{height:100%;display:grid;grid-template-rows:19% repeat(4,20.25%);border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.08);background:#f8f6f1}
.row{display:grid;grid-template-columns:18% 58% 24%;align-items:center;border-top:1px solid rgba(0,0,0,.08);font-size:clamp(9px,1.55vw,18px);font-weight:800}.row:first-child{border-top:0;background:#e6e1d8;font-size:clamp(8px,1.3vw,15px);font-weight:900}.c{text-align:center}.house{padding-left:2%}.ford .house{color:#2363a1}.violet .house{color:#6736a0}.albert .house{color:#b4302d}.highland .house{color:#bd900e}
@media(max-width:700px){.navlink{top:4.5%;height:4.5%}.recent{top:54.35%}}
</style>
</head>
<body>
<div class="page">
  <img class="bg" src="house-cup-approved.png" alt="Joyce Kilmer House Cup Standings 2026-2027">

  <a class="navlink nav-home" href="index.html" aria-label="Home"></a>
  <a class="navlink nav-cup" href="house-cup.html" aria-label="House Cup"></a>
  <a class="navlink nav-monthly" href="monthly-matchup.html" aria-label="Monthly Matchup"></a>
  <a class="navlink nav-events" href="events.html" aria-label="Events"></a>
  <a class="navlink nav-student" href="student-hub.html" aria-label="Student Hub"></a>
  <a class="navlink nav-gallery" href="gallery.html" aria-label="Gallery"></a>
  <a class="navlink nav-news" href="news.html" aria-label="Knight News"></a>

  <div class="point" id="pf">11</div><div class="point" id="pv">10</div><div class="point" id="pa">8</div><div class="point" id="ph">3</div>

  <section class="recent" id="recent">
    <div class="rhead"><div class="trophy">🏆</div><div class="rtitle"><strong>RECENT COMPETITION</strong><span id="ename">BACK TO SCHOOL</span></div></div>
    <div class="rbody"><div class="rtable" id="rtable">
      <div class="row"><div class="c">RANK</div><div class="house">HOUSE</div><div class="c">POINTS</div></div>
      <div class="row ford"><div class="c rk">1</div><div class="house">Ford Avenue</div><div class="c sc">11</div></div>
      <div class="row violet"><div class="c rk">2</div><div class="house">Violet Terrace</div><div class="c sc">10</div></div>
      <div class="row albert"><div class="c rk">3</div><div class="house">Albert Avenue</div><div class="c sc">8</div></div>
      <div class="row highland"><div class="c rk">4</div><div class="house">Highland Drive</div><div class="c sc">3</div></div>
    </div></div>
  </section>
</div>
<script>
(function(){
 const houses=[{k:'ford',n:'Ford Avenue',id:'pf'},{k:'violet',n:'Violet Terrace',id:'pv'},{k:'albert',n:'Albert Avenue',id:'pa'},{k:'highland',n:'Highland Drive',id:'ph'}];
 window.handleHouseCupData=function(resp){
  try{
   if(!resp||resp.status!=='ok') throw new Error('Feed error');
   const vals=(resp.table.rows||[]).map(r=>(r.c||[]).map(c=>c?c.v:null));
   const totals={}; vals.forEach(r=>{if(r[0]&&r[1]!==null&&r[1]!=='') totals[String(r[0]).trim()]=Number(r[1]);});
   houses.forEach(h=>{if(Number.isFinite(totals[h.n])) document.getElementById(h.id).textContent=totals[h.n];});
   const hdr=vals.findIndex(r=>String(r[0]||'').trim().toLowerCase()==='event');
   const eventRows=(hdr>=0?vals.slice(hdr+1):[]).filter(r=>r[0]);
   const completed=eventRows.filter(r=>[r[1],r[2],r[3],r[4]].every(v=>v!==null&&v!==''&&Number.isFinite(Number(v))));
   const ev=completed.length?completed[completed.length-1]:null;
   if(ev){
    document.getElementById('ename').textContent=String(ev[0]).toUpperCase();
    const score={ford:Number(ev[1]),violet:Number(ev[2]),albert:Number(ev[3]),highland:Number(ev[4])};
    const ranked=houses.map(h=>({...h,p:score[h.k]})).sort((a,b)=>b.p-a.p||a.n.localeCompare(b.n));
    const rows=document.querySelectorAll('#rtable .row:not(:first-child)');
    ranked.forEach((h,i)=>{const r=rows[i];r.className='row '+h.k;r.querySelector('.rk').textContent=i+1;r.querySelector('.house').textContent=h.n;r.querySelector('.sc').textContent=h.p;});
   }
  }catch(e){console.error(e);}
 };
 const s=document.createElement('script');
 s.src='https://docs.google.com/spreadsheets/d/1Jquf820HH6y39T5j-bfb3g761HAaZA2CQKBMGXqSDos/gviz/tq?sheet=Sheet1&tqx=responseHandler:handleHouseCupData&_='+Date.now();
 document.body.appendChild(s);
})();
</script>
</body>
</html>
