<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Albert Avenue House | Joyce Kilmer</title>
<style>
html,body{margin:0;background:#111;font-family:Arial,sans-serif}
.page{position:relative;width:min(100%,1024px);margin:auto;background:#faf7f0}
.base{display:block;width:100%;height:auto}
.nav a{position:absolute;top:5.2%;height:3.2%;z-index:8}
.nav .home{left:3%;width:8%}.nav .cup{left:12%;width:11%}.nav .match{left:24%;width:18%}.nav .events{left:43%;width:10%}.nav .hub{left:54%;width:14%}.nav .gallery{left:69%;width:11%}.nav .news{left:81%;width:14%}
.photo{position:absolute;left:3.05%;top:34.0%;width:31.7%;height:18.5%;object-fit:cover;object-position:center;z-index:4}
.live{position:absolute;z-index:7}
.points{left:39.2%;top:36.4%;width:21.8%;text-align:center;color:#fff;font-weight:900;font-size:clamp(25px,6.3vw,66px)}
.rank{left:39.2%;top:46.2%;width:21.8%;text-align:center;color:#111;font-weight:900;font-size:clamp(24px,5.5vw,58px)}
.about{left:66.1%;top:35.1%;width:28.8%;height:14.5%;background:#fbf8f1;padding:1.2%;font-size:clamp(9px,1.45vw,17px);line-height:1.38;overflow:auto}
.shouts{left:45.6%;top:64.6%;width:49.2%;height:17.2%;background:#fbf8f1;padding:.5%;overflow:hidden}
.shout{background:#fff;border-radius:8px;padding:1.3% 2%;margin:1.3% 0;font-size:clamp(8px,1.2vw,14px);line-height:1.25;box-shadow:0 1px 4px #0002}
.shout b{display:block}.pager{text-align:center;font-size:11px}.pager button{border:0;background:#111;color:#fff;padding:4px 8px;border-radius:4px;margin:0 4px}
@media(max-width:600px){.about{font-size:8px}.shout{font-size:7px}.pager{font-size:8px}}
</style></head>
<body><div class="page">
<img class="base" src="albert-approved-design.png" alt="Albert Avenue House">
<div class="nav">
<a class="home" href="index.html" aria-label="Home"></a><a class="cup" href="house-cup.html" aria-label="House Cup"></a>
<a class="match" href="monthly-matchup.html" aria-label="Monthly Matchup"></a><a class="events" href="events.html" aria-label="Events"></a>
<a class="hub" href="student-hub.html" aria-label="Student Hub"></a><a class="gallery" href="gallery.html" aria-label="Gallery"></a>
<a class="news" href="news.html" aria-label="Knight News"></a>
</div>
<!-- Exact original uploaded photograph overlays the mockup's leader-photo area. -->
<img class="photo" src="mrs-manise.jpeg" alt="Mrs. Manise">
<div id="points" class="live points">—</div><div id="rank" class="live rank">—</div>
<div id="about" class="live about">Loading live Albert Avenue description…</div>
<div class="live shouts"><div id="shoutbox">Loading live Albert Avenue shout-outs…</div><div class="pager"><button id="prev">Previous</button><span id="pg"></span><button id="next">Next</button></div></div>
</div>
<script>
const H=['Ford Avenue','Violet Terrace','Albert Avenue','Highland Drive'];
function v(c){return c&&c.v!=null?c.v:''}
function load(u){let s=document.createElement('script');s.src=u+(u.includes('?')?'&':'?')+'_='+Date.now();document.body.appendChild(s)}
window.albertPoints=function(r){let t={};r.table.rows.forEach(x=>{let a=x.c.map(v),n=String(a[0]).trim();if(H.includes(n))t[n]=Number(a[1])||0});points.textContent=t['Albert Avenue']??'—';let q=H.slice().sort((a,b)=>(t[b]??-1)-(t[a]??-1)),p=q.indexOf('Albert Avenue')+1;rank.textContent=p? p+({1:'ST',2:'ND',3:'RD'}[p]||'TH'):'—'}
window.albertAbout=function(r){let f='';r.table.rows.forEach(x=>{let a=x.c.map(v);if(String(a[0]).trim()==='Albert Avenue')f=a[1]||''});about.textContent=f||'About Our House content will appear here when it is added to the live House About sheet.'}
let S=[],P=0;
function esc(x){return String(x||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function draw(){shoutbox.innerHTML='';let slice=S.slice(P*3,P*3+3);if(!slice.length)shoutbox.textContent='No Albert Avenue shout-outs have been posted yet.';slice.forEach(x=>{let d=document.createElement('div');d.className='shout';d.innerHTML='<b>'+esc(x.n)+(x.g?' • Grade '+esc(x.g):'')+'</b>'+esc(x.s)+(x.by?'<br><small>Submitted by '+esc(x.by)+'</small>':'');shoutbox.appendChild(d)});let pages=Math.max(1,Math.ceil(S.length/3));pg.textContent=pages>1?' '+(P+1)+' of '+pages+' ':'';prev.style.visibility=P?'visible':'hidden';next.style.visibility=P<pages-1?'visible':'hidden'}
window.albertShouts=function(r){let c=r.table.cols.map(x=>(x.label||'').toLowerCase()),i=n=>c.indexOf(n);S=r.table.rows.map(x=>x.c.map(v)).filter(a=>String(a[i('house')]).trim()==='Albert Avenue').map(a=>({n:a[i('student name')],g:a[i('grade')],s:a[i('shout-out')],by:a[i('submitted by')]})).reverse();draw()}
prev.onclick=()=>{if(P){P--;draw()}};next.onclick=()=>{if((P+1)*3<S.length){P++;draw()}}
load('https://docs.google.com/spreadsheets/d/1Jquf820HH6y39T5j-bfb3g761HAaZA2CQKBMGXqSDos/gviz/tq?sheet=Sheet1&tqx=responseHandler:albertPoints');
load('https://docs.google.com/spreadsheets/d/1zVuk5ETAVylUWVk5O6aW0_loKz_GoIWs5V8dNTunH0M/gviz/tq?sheet=House%20About&headers=1&tqx=responseHandler:albertAbout');
load('https://docs.google.com/spreadsheets/d/e/2PACX-1vRi8dFpeOjCBCan6mUjOkdY4BFj_b-kn7nMlp-uV4ICBwQhkhOiNy2EJ2YW_8ZQ_qqPLSkHFmiDfUv/gviz/tq?gid=1496082196&tqx=responseHandler:albertShouts');
</script></body></html>
