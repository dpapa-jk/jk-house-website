<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Hub | Joyce Kilmer House Program</title>
<style>
html,body{margin:0;background:#111}
.page{position:relative;width:100%;max-width:none;margin:0}
.bg{display:block;width:100%;height:auto}
.hot{position:absolute;display:block;z-index:5}
.home{left:29%;top:.7%;width:5%;height:3.5%}
.cup{left:35.5%;top:.7%;width:7.5%;height:3.5%}
.match{left:44%;top:.7%;width:12%;height:3.5%}
.events{left:57%;top:.7%;width:6%;height:3.5%}
.hub{left:63%;top:.2%;width:9%;height:4.5%}
.gallery{left:73%;top:.7%;width:7%;height:3.5%}
.news{left:81%;top:.7%;width:8%;height:3.5%}
.flex{left:3%;top:67%;width:29%;height:5%}
.week{left:35%;top:67%;width:29%;height:5%}
.gpa{left:68%;top:67%;width:29%;height:5%}
.school{left:3%;top:86.3%;width:22%;height:4.6%}
.grades{left:27%;top:86.3%;width:22%;height:4.6%}
.calendar{left:51%;top:86.3%;width:22%;height:4.6%}
.flyers{left:75%;top:86.3%;width:22%;height:4.6%}
</style>

<style>
#flyerModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;padding:24px;box-sizing:border-box}
#flyerModal.open{display:flex;align-items:center;justify-content:center}
.flyer-panel{background:#f7f1e5;width:min(760px,96vw);max-height:88vh;overflow:auto;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.4);font-family:Arial,sans-serif}
.flyer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:4px solid #075d3f;padding-bottom:12px;margin-bottom:16px}
.flyer-head h2{margin:0;color:#075d3f;font-size:30px}
.flyer-close{border:0;background:#075d3f;color:#fff;border-radius:999px;width:38px;height:38px;font-size:24px;cursor:pointer}
.flyer-sub{margin:0 0 18px;color:#47514c;font-weight:600}
.flyer-list{display:grid;gap:12px}
.flyer-row{background:#fff;border:1px solid #d8d4ca;border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.flyer-name{font-weight:800;color:#173f31;overflow-wrap:anywhere}
.flyer-view{display:inline-block;background:#075d3f;color:#fff;text-decoration:none;font-weight:800;padding:9px 14px;border-radius:7px;white-space:nowrap}
.flyer-status{padding:18px;background:#fff;border-radius:12px;color:#47514c}
@media(max-width:600px){
 .flyer-panel{padding:18px}
 .flyer-head h2{font-size:24px}
 .flyer-row{align-items:flex-start;flex-direction:column}
 .flyer-view{width:100%;text-align:center;box-sizing:border-box}
}
</style>
</head>
<body>
<div class="page">
<img class="bg" src="student-hub-final.png" alt="Joyce Kilmer Student Hub">

<a class="hot home" href="index.html" aria-label="Home"></a>
<a class="hot cup" href="house-cup.html" aria-label="House Cup"></a>
<a class="hot match" href="monthly-matchup.html" aria-label="Monthly Matchup"></a>
<a class="hot events" href="events.html" aria-label="Events"></a>
<a class="hot hub" href="student-hub.html" aria-label="Student Hub"></a>
<a class="hot gallery" href="gallery.html" aria-label="Gallery"></a>
<a class="hot news" href="news.html" aria-label="Knight News"></a>

<a class="hot flex" href="flex.pdf" target="_blank" aria-label="FLEX RTI Request Form"></a>
<a class="hot week" href="weekly-planner.pdf" target="_blank" aria-label="Weekly Planner"></a>
<a class="hot gpa" href="gpa-tracker.pdf" target="_blank" aria-label="GPA Tracker"></a>

<a class="hot school" href="https://www.milltownps.org" target="_blank" rel="noopener" aria-label="School Website"></a>
<a class="hot grades" href="https://genesis.c1.genesisedu.net/milltown/sis/view?gohome=true" target="_blank" rel="noopener" aria-label="Check Your Grades"></a>
<a class="hot calendar" href="https://4.files.edl.io/1bcb/07/06/26/190157-41b8d99d-9e09-4387-877b-b6a93e48704c.pdf" target="_blank" rel="noopener" aria-label="School Calendar"></a>
<a class="hot flyers" id="flyerHub" href="#" aria-label="Flyer Hub"></a>
</div>


<div id="flyerModal" role="dialog" aria-modal="true" aria-labelledby="flyerTitle">
  <div class="flyer-panel">
    <div class="flyer-head">
      <h2 id="flyerTitle">FLYER HUB</h2>
      <button class="flyer-close" id="flyerClose" aria-label="Close">×</button>
    </div>
    <p class="flyer-sub">Latest school flyers, announcements, and helpful information.</p>
    <div id="flyerList" class="flyer-list"><div class="flyer-status">Loading flyers…</div></div>
  </div>
</div>

<script>
const FLYER_FEED = "https://script.google.com/macros/s/AKfycbwe2ULn5jD0HIWJIJdXcre5PoeitVH2n-ii0Cju11Qh2smWEYDVuXPISyKdMWtt2wh1/exec";
const flyerHub = document.getElementById("flyerHub");
const flyerModal = document.getElementById("flyerModal");
const flyerList = document.getElementById("flyerList");
const flyerClose = document.getElementById("flyerClose");

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

async function refreshFlyers() {
  flyerList.innerHTML = '<div class="flyer-status">Loading flyers…</div>';
  try {
    const r = await fetch(FLYER_FEED + "?_=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("feed");
    const flyers = await r.json();
    if (!Array.isArray(flyers) || flyers.length === 0) {
      flyerList.innerHTML = '<div class="flyer-status">There are no school flyers posted right now.</div>';
      return;
    }
    flyerList.innerHTML = flyers.map(f => `
      <div class="flyer-row">
        <div class="flyer-name">${esc(f.name)}</div>
        <a class="flyer-view" href="${esc(f.url)}" target="_blank" rel="noopener">VIEW PDF</a>
      </div>`).join("");
  } catch(e) {
    flyerList.innerHTML = '<div class="flyer-status">Flyers are temporarily unavailable. Please try again.</div>';
  }
}

flyerHub.addEventListener("click", e => {
  e.preventDefault();
  flyerModal.classList.add("open");
  refreshFlyers();
});
flyerClose.addEventListener("click", () => flyerModal.classList.remove("open"));
flyerModal.addEventListener("click", e => { if(e.target === flyerModal) flyerModal.classList.remove("open"); });
document.addEventListener("keydown", e => { if(e.key === "Escape") flyerModal.classList.remove("open"); });
</script>
</body>
</html>
