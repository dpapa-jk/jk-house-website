<title>Monthly Matchup | Joyce Kilmer House Program</title>
<style>
:root{--green:#064f3f;--deep:#043d32;--gold:#d5b246;--cream:#f7f2e7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:#10261f}
a{text-decoration:none;color:inherit}
.topbar{background:linear-gradient(90deg,#075847,#034236);color:#fff;display:flex;align-items:center;gap:24px;padding:12px 28px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px #0003}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;line-height:1.08;white-space:nowrap;margin-right:auto}
.brandmark{width:44px;height:44px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:24px;flex:0 0 auto}
.nav{display:flex;gap:22px;align-items:center;font-weight:700;white-space:nowrap}
.nav a{opacity:.96;padding:10px 0;border-bottom:3px solid transparent}
.nav a:hover,.nav a:focus-visible{color:#f6db76;border-bottom-color:#f6db76;outline:none}
.nav a.active{border-bottom-color:var(--gold)}
.poster-wrap{max-width:1536px;margin:0 auto;background:#fff;box-shadow:0 12px 34px #173d3020}
.poster{display:block;width:100%;height:auto}
.home-btn{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;border:2px solid #fff;border-radius:999px;padding:11px 17px;font-weight:800;box-shadow:0 5px 18px #0004;z-index:40}
.home-btn:hover{background:var(--deep)}
@media(max-width:1000px){.topbar{align-items:flex-start;flex-wrap:wrap;padding:10px 16px}.brand{width:100%;margin-right:0}.nav{width:100%;overflow-x:auto;gap:20px;padding-bottom:3px;scrollbar-width:thin}.nav a{flex:0 0 auto}.poster-wrap{box-shadow:none}}
@media(max-width:560px){.brand{font-size:16px}.brandmark{width:38px;height:38px;font-size:20px}.nav{font-size:14px;gap:17px}.topbar{position:relative}.home-btn{font-size:13px;padding:9px 13px}}
</style>
</head>
