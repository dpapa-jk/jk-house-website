<style>
*{box-sizing:border-box}body{margin:0;background:#f7f0df;color:#111;font-family:'Baloo 2',Arial,sans-serif}.top{background:#075038;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:13px 5%;gap:18px}.brand{font-size:20px;font-weight:800}.nav{display:flex;gap:18px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;font-size:13px;font-weight:800}.nav .active{border-bottom:4px solid #ffd34d}.hero{height:250px;background:#f7f0df url('events-illustrated-banner.jpg') center/cover no-repeat;border-bottom:5px solid #111}
.hero h1,.hero p{position:absolute;left:-9999px}main{max-width:1220px;margin:auto;padding:30px 22px 55px}.section{text-align:center;margin:8px 0 24px}.section span{display:inline-block;background:#075038;color:#fff;border:4px solid #111;border-radius:12px;padding:5px 28px;font:32px Anton,Impact,sans-serif;letter-spacing:2px;box-shadow:5px 5px #111}.feature{display:none;background:#fff;border:5px solid #075038;border-radius:26px;box-shadow:8px 8px #111;overflow:hidden;grid-template-columns:175px 1fr 250px;margin-bottom:42px}.date{background:#fffaf0;border-right:3px solid #222;text-align:center;display:flex;flex-direction:column;justify-content:center}.date .wd{background:#075038;color:#fff;font-size:19px;font-weight:800;padding:7px}.date .mo{font-size:24px;font-weight:800}.date .day{font:58px Anton,Impact,sans-serif}.copy{padding:24px 28px}.title{font:clamp(31px,4vw,55px)/1 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:1px;-webkit-text-stroke:1px #111;text-shadow:3px 3px #fff,5px 5px #111;margin-bottom:15px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{border:2px solid #222;border-radius:18px;padding:5px 10px;font-weight:800;background:#f7f0dc}.details{font-size:17px;line-height:1.35}.photo{background:#fff8e8;border-left:2px solid #bbb;min-height:220px;display:grid;place-items:center;padding:12px}.photo img{width:100%;height:210px;object-fit:contain;border-radius:14px}.fallback{width:150px;height:150px;border:7px solid #075038;border-radius:50%;display:grid;place-items:center;font:52px Anton;color:#075038;background:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.card{background:#fff;border:4px solid #111;border-radius:18px;box-shadow:5px 5px #333;overflow:hidden}.stripe{height:11px}.cardin{display:grid;grid-template-columns:105px 1fr 155px;min-height:215px}.smdate{text-align:center;border-right:2px solid #bbb;background:#fffaf0;padding-top:16px}.smdate .wd,.smdate .mo{font-weight:800}.smdate .d{font:40px Anton}.smallcopy{padding:18px}.smallcopy h3{font:27px/1 Anton;margin:0 0 10px;text-transform:uppercase}.thumb{display:grid;place-items:center;padding:10px;background:#fff8e8}.thumb img{width:135px;height:150px;object-fit:contain;border-radius:12px}.thumb .fallback{width:90px;height:90px;font-size:32px;border-width:5px}.empty{text-align:center;padding:42px;font-weight:800;grid-column:1/-1}footer{background:#111;color:#fff;text-align:center;padding:20px;font-size:12px;font-weight:800;letter-spacing:2px}@media(max-width:800px){.top{align-items:flex-start;flex-direction:column}.nav{gap:10px}.feature{grid-template-columns:120px 1fr}.feature .photo{grid-column:1/-1;border-left:0;border-top:2px solid #bbb}.grid{grid-template-columns:1fr}.cardin{grid-template-columns:90px 1fr 115px}}
</style><script>
/* Paste the deployed Apps Script /exec URL below ONCE. After that, the Sheet only needs filenames. */
window.JK_EVENTS_IMAGE_FEED="https://script.google.com/macros/s/AKfycbyexQ_2_Z6TP1BhhmcuarVSxpIS7tvd2XpDtTRLCAAZXS6kIkofJhTup0B80Ih_lS8v/exec";
</script>
</head><body>
<header class="top"><div class="brand">◉ JK &nbsp; Joyce Kilmer House Program</div><nav class="nav"><a href="index.html">HOME</a><a href="house-cup.html">HOUSE CUP</a><a href="monthly-matchup.html">MONTHLY MATCHUP</a><a class="active" href="events.html">EVENTS</a><a href="student-hub.html">STUDENT HUB</a><a href="gallery.html">GALLERY</a><a href="news.html">KNIGHT NEWS</a></nav></header>
<section class="hero"><h1>UPCOMING EVENTS</h1><p>FOUR HOUSES. ONE FAMILY. • SEE WHAT'S COMING UP AT JK!</p></section>
<main><div class="section"><span>COMING UP NEXT</span></div><section id="feature" class="feature"></section><div class="section"><span>ALL UPCOMING EVENTS</span></div><section id="grid" class="grid"><div class="empty">Loading upcoming events…</div></section></main>
<footer>COOPERATION | ASSERTION | RESPONSIBILITY | EMPATHY | SELF-CONTROL</footer>
<script>
const ID="1b_OX7tOYSgKr8EmNJaInqmtOoVD9K9u-F977M9Zt3O4",SHEET="Events";
const COLORS={"Ford Avenue":"#1767bc","Albert Avenue":"#c62828","Highland Drive":"#e6bd16","Violet Terrace":"#7040a0","All Houses":"#075038"};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function dt(v){if(!v)return null;if(typeof v==="string"&&v.startsWith("Date(")){let a=v.match(/\d+/g).map(Number);return new Date(a[0],a[1],a[2])}let d=new Date(String(v)+"T12:00:00");return isNaN(d)?null:d}
let IMAGE_INDEX={};
function normName(s){return String(s||"").trim().toLowerCase()}
function driveImage(v){
  v=String(v||"").trim(); if(!v)return"";
  if(/^https?:\/\//i.test(v)){let m=v.match(/[-\w]{25,}/);if(v.includes("drive.google.com")&&m)return"https://drive.google.com/thumbnail?id="+m[0]+"&sz=w1200";return v}
  return IMAGE_INDEX[normName(v)]||IMAGE_INDEX[normName(v).replace(/\.[^.]+$/,"")]||"";
}
async function loadImageIndex(){
  const url=window.JK_EVENTS_IMAGE_FEED||"";
  if(!url)return;
  try{
    const res=await fetch(url,{cache:"no-store"});
    const data=await res.json();
    const items=Array.isArray(data)?data:(data.files||data.images||[]);
    items.forEach(x=>{
      const name=x.name||x.fileName||x.filename||"";
      const id=x.id||x.fileId||"";
      const u=x.thumbnail||x.thumbnailUrl||x.url||(id?`https://drive.google.com/thumbnail?id=${id}&sz=w1200`:"");
      if(name&&u){
        IMAGE_INDEX[normName(name)]=u;
        IMAGE_INDEX[normName(name).replace(/\.[^.]+$/,"")]=u;
      }
    });
  }catch(e){console.warn("Image feed unavailable",e)}
}
function pic(e,small=false){let u=driveImage(e.image);return u?`<img src="${esc(u)}" alt="${esc(e.event)}" onerror="this.parentElement.innerHTML='<div class=&quot;fallback&quot;>JK</div>'">`:'<div class="fallback">JK</div>'}
function parts(e){let a=dt(e.start),b=dt(e.end||e.start);return{wd:a.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase(),mo:a.toLocaleDateString("en-US",{month:"short"}).toUpperCase(),day:a.toDateString()==b.toDateString()?a.getDate():a.getDate()+"–"+b.getDate()}}
function meta(e){return[e.time&&"◷ "+esc(e.time),e.location&&"● "+esc(e.location),e.house&&"♟ "+esc(e.house)].filter(Boolean).map(x=>'<span class="pill">'+x+'</span>').join("")}
function color(e){return COLORS[e.house]||"#075038"}
function card(e){let p=parts(e);return`<article class="card"><div class="stripe" style="background:${color(e)}"></div><div class="cardin"><div class="smdate"><div class="wd">${p.wd}</div><div class="mo">${p.mo}</div><div class="d">${p.day}</div></div><div class="smallcopy"><h3>${esc(e.event)}</h3><div class="meta">${meta(e)}</div><div>${esc(e.details)}</div></div><div class="thumb">${pic(e,true)}</div></div></article>`}
function render(rows){let now=new Date();now.setHours(0,0,0,0);let a=rows.map(r=>({start:r.c[0]?.v||"",end:r.c[1]?.v||"",event:r.c[2]?.v||"",time:r.c[3]?.v||"",location:r.c[4]?.v||"",house:r.c[5]?.v||"",details:r.c[6]?.v||"",type:r.c[7]?.v||"",image:r.c[8]?.v||""})).filter(e=>e.event&&dt(e.end||e.start)&&dt(e.end||e.start)>=now).sort((x,y)=>dt(x.start)-dt(y.start));let f=document.getElementById("feature"),g=document.getElementById("grid");if(!a.length){g.innerHTML='<div class="empty">No upcoming events are posted yet.</div>';return}let e=a[0],p=parts(e);f.style.display="grid";f.innerHTML=`<div class="date"><div class="wd">${p.wd}</div><div class="mo">${p.mo}</div><div class="day">${p.day}</div></div><div class="copy"><div class="title" style="color:${color(e)}">${esc(e.event)}</div><div class="meta">${meta(e)}</div><div class="details">${esc(e.details)}</div></div><div class="photo">${pic(e)}</div>`;g.innerHTML=a.slice(1).map(card).join("")||'<div class="empty">More events coming soon!</div>'}
async function load(){await loadImageIndex();let cb="jkEv"+Date.now();window[cb]=d=>{render(d.table.rows||[]);delete window[cb]};let s=document.createElement("script");s.src=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?sheet=${encodeURIComponent(SHEET)}&headers=1&tqx=responseHandler:${cb}&_=${Date.now()}`;s.onerror=()=>document.getElementById("grid").innerHTML='<div class="empty">Events are temporarily unavailable.</div>';document.body.appendChild(s)}load();
</script></body></html>
