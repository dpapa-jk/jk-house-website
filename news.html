<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knight News | Joyce Kilmer House Program</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1e7;color:#0b2f29;font-family:Arial,Helvetica,sans-serif}
.topbar{background:#034c3f;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:15px 28px;gap:20px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:800}
.badge{width:42px;height:42px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:21px}
.nav{display:flex;gap:24px;flex-wrap:wrap;justify-content:flex-end}
.nav a{color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.hero img{display:block;width:100%;height:auto}
.wrap{max-width:1180px;margin:0 auto;padding:34px 24px 70px}
.feed-status{text-align:center;padding:24px;font-weight:700;color:#5a6a65}
.featured{border:5px solid #075143;border-radius:18px;background:#fff;overflow:hidden;margin-bottom:20px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.featured-inner{display:grid;grid-template-columns:240px 1fr;min-height:280px}
.feature-side{display:flex;align-items:center;justify-content:center;padding:24px;font-weight:900;font-size:28px;text-align:center;line-height:1.05;position:relative;overflow:hidden}
.feature-body{padding:28px 32px}
.date{font-size:14px;font-weight:700;color:#315c54;margin-bottom:10px}
.headline{font-size:clamp(30px,4vw,52px);line-height:.98;margin:0 0 14px;font-weight:900;color:#082f2a}
.announcement{font-size:18px;line-height:1.45;color:#173c36;white-space:pre-wrap}
.house-tag{display:inline-block;margin-top:18px;padding:8px 13px;border-radius:999px;font-weight:800;font-size:13px;background:#f1ead9;color:#123d36}
.news-list{display:grid;gap:14px}
.news-card{display:grid;grid-template-columns:240px 1fr;min-height:320px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.news-side{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-weight:900;font-size:20px;line-height:1.05;position:relative;overflow:hidden;min-height:320px}
.news-body{padding:22px 26px}
.news-card h2{margin:4px 0 8px;font-size:28px;line-height:1.05;color:#11264d}
.news-card p{margin:0;color:#243d38;line-height:1.42;font-size:16px;white-space:pre-wrap}
.side-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.type-badge{position:absolute;left:10px;bottom:10px;z-index:2;background:rgba(3,76,63,.92);color:#fff;border:2px solid rgba(255,255,255,.9);padding:7px 10px;border-radius:999px;font-weight:900;font-size:11px;letter-spacing:.5px;line-height:1}
.feature-side .type-badge{left:14px;bottom:14px;font-size:12px;padding:8px 12px}
.footer{background:#034c3f;color:#fff;text-align:center;padding:28px 16px;font-size:14px;letter-spacing:1.7px;font-weight:700}
.type-New-Challenge,.type-Upcoming-Event{background:#f4bf3a;color:#102e29}
.type-Points-Update{background:#0f4a8a;color:white}
.type-House-Spotlight{background:#5c187a;color:white}
.type-Reminder{background:#0b5b4b;color:white}
.type-Winner{background:#a70f16;color:white}
.house-Ford-Avenue{border-left:7px solid #174f9b}
.house-Violet-Terrace{border-left:7px solid #6d268f}
.house-Highland-Drive{border-left:7px solid #e4ae14}
.house-Albert-Avenue{border-left:7px solid #c82127}
@media(max-width:760px){
 .topbar{align-items:flex-start;flex-direction:column}
 .nav{gap:12px}
 .featured-inner{grid-template-columns:1fr}
 .feature-side{min-height:190px}
 .news-card{grid-template-columns:1fr}
 .news-side{min-height:320px}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="badge">JK</span><span>Joyce Kilmer House Program</span></a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="house-cup.html">House Cup</a>
    <a href="monthly-matchup.html">Monthly Matchup</a>
    <a href="events.html">Events</a>
    <a href="student-hub.html">Student Hub</a>
    <a href="gallery.html">Gallery</a>
    <a href="news.html">Knight News</a>
  </nav>
</header>

<section class="hero"><img src="knight-news-hero.png" alt="Knight News — Four Houses. One Family."></section>

<main class="wrap">
  <div id="feedStatus" class="feed-status">Loading Knight News…</div>
  <section id="featuredSlot"></section>
  <section id="newsList" class="news-list"></section>
</main>

<footer class="footer">COOPERATION • ASSERTION • RESPONSIBILITY • EMPATHY • SELF-CONTROL</footer>

<script>
const SHEET_ID = '19gk6tt_gc8vAfCV7YRwt041thg90m3uq4MvDONIR34Q';
const SHEET_NAME = 'Knight News';
const callbackName = 'renderKnightNews';
const PHOTO_FEED = 'https://script.google.com/macros/s/AKfycbzGvzVi3GC7lEF4vkjPy5RAcTJAQ3OHx7HqbCIElhfYkYsR6cy0MTHPfVO0gsQ0T9WasA/exec';

let photoMap = {};

function clean(v){ return (v ?? '').toString().trim(); }
function slug(v){ return clean(v).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function typeLabel(type){ return clean(type).toUpperCase() || 'KNIGHT NEWS'; }
function parseDate(v){ if (!v) return new Date(0); const d=new Date(v); return isNaN(d)?new Date(0):d; }
function formatDate(v){ const d=parseDate(v); if(d.getTime()===0) return clean(v); return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
function photoKey(v){ return clean(v).replace(/\.[^/.]+$/,'').toLowerCase(); }
function esc(v){
  return clean(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function photoPanel(photoName,type,featured=false){
  const url=photoMap[photoKey(photoName)];
  const sideClass=featured?'feature-side':'news-side';
  if(url){
    return `<div class="${sideClass}">
      <img class="side-photo" src="${esc(url)}" alt="${esc(photoName)}">
      <span class="type-badge">${esc(typeLabel(type))}</span>
    </div>`;
  }
  return `<div class="${sideClass} type-${slug(type)}">${esc(typeLabel(type))}</div>`;
}

async function loadPhotoFeed(){
  try{
    const res = await fetch(`${PHOTO_FEED}?_=${Date.now()}`, {cache:'no-store'});
    if(!res.ok) throw new Error('Photo feed unavailable');
    const photos = await res.json();
    if(Array.isArray(photos)){
      photos.forEach(p=>{
        if(p && p.name && p.url) photoMap[photoKey(p.name)] = p.url;
      });
    }
  }catch(e){
    console.warn('Knight News photo feed unavailable; using type panels.', e);
  }
}

window[callbackName] = async function(resp){
  const status=document.getElementById('feedStatus');
  const featuredSlot=document.getElementById('featuredSlot');
  const list=document.getElementById('newsList');
  try {
    await loadPhotoFeed();

    const rows=(resp.table.rows||[]).map(r=>{
      const c=r.c||[];
      return {
        date:c[0]?.f||c[0]?.v||'',
        headline:c[1]?.v||'',
        announcement:c[2]?.v||'',
        type:c[3]?.v||'',
        house:c[4]?.v||'',
        photo:c[5]?.v||''
      };
    }).filter(x=>clean(x.headline)||clean(x.announcement));

    rows.sort((a,b)=>parseDate(b.date)-parseDate(a.date));

    if(!rows.length){status.textContent='No Knight News has been posted yet.';return;}
    status.style.display='none';
    const first=rows[0];

    featuredSlot.innerHTML=`
      <article class="featured house-${slug(first.house)}">
        <div class="featured-inner">
          ${photoPanel(first.photo,first.type,true)}
          <div class="feature-body">
            <div class="date">${esc(formatDate(first.date))}</div>
            <h1 class="headline">${esc(first.headline)}</h1>
            <div class="announcement">${esc(first.announcement)}</div>
            ${first.house?`<span class="house-tag">${esc(first.house)}</span>`:''}
          </div>
        </div>
      </article>`;

    list.innerHTML=rows.slice(1).map(item=>`
      <article class="news-card house-${slug(item.house)}">
        ${photoPanel(item.photo,item.type,false)}
        <div class="news-body">
          <div class="date">${esc(formatDate(item.date))}</div>
          <h2>${esc(item.headline)}</h2>
          <p>${esc(item.announcement)}</p>
          ${item.house?`<span class="house-tag">${esc(item.house)}</span>`:''}
        </div>
      </article>`).join('');
  } catch(e) {
    console.error(e);
    status.textContent='Knight News is temporarily unavailable.';
  }
};

const script=document.createElement('script');
script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&headers=1&tqx=responseHandler:${callbackName}&_=${Date.now()}`;
script.onerror=()=>{document.getElementById('feedStatus').textContent='Knight News is temporarily unavailable.';};
document.body.appendChild(script);
</script>
</body>
</html>
